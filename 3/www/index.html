        class Store {
            constructor() {
                const saved = JSON.parse(localStorage.getItem(STORAGE_VERSION) || 'null');
                if (saved) {
                    this.materials = saved.materials;
                    this.labor = { ...DEFAULT_LABOR, ...saved.labor };
                    this.config = {
                        ...DEFAULT_CONFIG,
                        ...saved.config,
                        addon_overrides: { ...DEFAULT_CONFIG.addon_overrides, ...(saved.config?.addon_overrides || {}) }
                    };
                    this.published = saved.published || this._makeSnapshot();
                    this.hasUnpublished = !!saved.hasUnpublished;
                } else {
                    this.materials = JSON.parse(JSON.stringify(DEFAULT_MATERIALS));
                    this.labor = JSON.parse(JSON.stringify(DEFAULT_LABOR));
                    this.config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
                    this.published = this._makeSnapshot();
                    this.hasUnpublished = false;
                    this.persist();
                }
                this.isAdmin = sessionStorage.getItem('darkom_admin') === 'true';
            }
            _makeSnapshot() {
                return {
                    materials: JSON.parse(JSON.stringify(this.materials)),
                    labor: JSON.parse(JSON.stringify(this.labor)),
                    config: JSON.parse(JSON.stringify(this.config)),
                    publishedAt: new Date().toLocaleString('ar-EG')
                };
            }
            persist() {
                localStorage.setItem(STORAGE_VERSION, JSON.stringify({
                    materials: this.materials, labor: this.labor, config: this.config,
                    published: this.published, hasUnpublished: this.hasUnpublished
                }));
            }
            markDirty() { this.hasUnpublished = true; this.persist(); }
            publish() { this.published = this._makeSnapshot(); this.hasUnpublished = false; this.persist(); }

            // Scoped reset: ONLY Materials (or only active category)
            resetMaterials(cat = 'all') {
                if (cat === 'all') {
                    this.materials = JSON.parse(JSON.stringify(DEFAULT_MATERIALS));
                } else {
                    this.materials = this.materials.map(m => {
                        if (m.cat === cat) {
                            const def = DEFAULT_MATERIALS.find(d => d.id === m.id);
                            return def ? JSON.parse(JSON.stringify(def)) : m;
                        }
                        return m;
                    });
                }
                this.markDirty();
            }
            // Scoped reset: ONLY Labor & Margin/Addon Settings
            resetLaborAndConfig() {
                this.labor = JSON.parse(JSON.stringify(DEFAULT_LABOR));
                this.config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
                this.markDirty();
            }
            // Scoped reset: Revert draft back to last published snapshot
            revertToPublished() {
                this.materials = JSON.parse(JSON.stringify(this.published.materials));
                this.labor = JSON.parse(JSON.stringify(this.published.labor));
                this.config = JSON.parse(JSON.stringify(this.published.config));
                this.hasUnpublished = false;
                this.persist();
            }
            getDataset(useDraft = false) {
                return useDraft ? { materials: this.materials, labor: this.labor, config: this.config } : this.published;
            }
        }
        const store = new Store();

        // =====================================================================
        // 3. EXACT ENGINEERING PRICING ENGINE
        // =====================================================================
        const Engine = {
            priceOf(ds, id) {
                const item = ds.materials.find(m => m.id === id);
                return item ? Number(item.price) || 0 : 0;
            },
            roundUp(val, step) {
                return (!step || step <= 1) ? Math.ceil(val) : Math.ceil(val / step) * step;
            },
            suspensionFlatMat(ds, isTish) {
                if (!isTish) return 1.20 * (this.priceOf(ds, 70) / 50) + (1 / 35) * this.priceOf(ds, 69);
                return 0.27 * this.priceOf(ds, 71) + 1.20 * (this.priceOf(ds, 68)/100 + this.priceOf(ds, 75) + this.priceOf(ds, 76) + 2 * (this.priceOf(ds, 74)/380));
            },
            tishLinearMatDelta(ds) {
                const ganshPt = (this.priceOf(ds, 70)/50) + (this.priceOf(ds, 73)/100) + (0.025 * this.priceOf(ds, 69));
                const tishPt = (0.40 * (this.priceOf(ds, 71)/2)) + (this.priceOf(ds, 68)/100) + this.priceOf(ds, 75) + this.priceOf(ds, 76) + 2 * (this.priceOf(ds, 74)/380);
                return Math.max(0, tishPt - ganshPt);
            },
            ceilingFastPuttyMat(ds, isTish) {
                return 20*(this.priceOf(ds,57)/1000) + 8*(this.priceOf(ds,67)/1000) + (isTish?2.5:3.5)*(this.priceOf(ds,73)/100) + 0.40*(this.priceOf(ds,49)/12.5) + 1.60*(this.priceOf(ds,48)/90);
            },
            // Helper: Shadow & Bead unit costs/sells
            addonUnit(ds, kind) {
                const marginMult = 1 + (ds.config.ceiling_margin_pct / 100);
                const ov = ds.config.addon_overrides || {};
                const puttyKg = this.priceOf(ds, 49) / 12.5;
                const s25 = this.priceOf(ds, 57) / 1000;
                const ratio = Number(ds.config.shadow_flat_ratio) || 1.00;

                if (kind === 'shadow') {
                    const costLm = (this.priceOf(ds, ds.config.default_shadow_id) * 1.08) / 3 + ds.labor.shadow_gap_m;
                    const sellLm = ov.shadow_sell > 0 ? ov.shadow_sell : this.roundUp(costLm * marginMult, ds.config.round_to);
                    const costFlat = costLm * ratio;
                    const sellFlat = ov.shadow_flat_sell > 0 ? ov.shadow_flat_sell : this.roundUp(costFlat * marginMult, ds.config.round_to);
                    return { costLm, sellLm, costFlat, sellFlat, ratio };
                }
                if (kind === 'shadowLed') {
                    const costLm = (this.priceOf(ds, ds.config.default_shadow_led_id) * 1.08) / 3 + ds.labor.shadow_led_m;
                    const sellLm = ov.shadow_led_sell > 0 ? ov.shadow_led_sell : this.roundUp(costLm * marginMult, ds.config.round_to);
                    const costFlat = costLm * ratio;
                    const sellFlat = ov.shadow_led_flat_sell > 0 ? ov.shadow_led_flat_sell : this.roundUp(costFlat * marginMult, ds.config.round_to);
                    return { costLm, sellLm, costFlat, sellFlat, ratio };
                }
                if (kind === 'corner') {
                    const costLm = (this.priceOf(ds, 85) * 1.08) / 3 + 0.15 * puttyKg + 5 * s25 + ds.labor.corner_bead_m;
                    const sellLm = ov.corner_sell > 0 ? ov.corner_sell : this.roundUp(costLm * marginMult, ds.config.round_to);
                    return { costLm, sellLm };
                }
                if (kind === 'endBead') {
                    const costLm = (this.priceOf(ds, 86) * 1.08) / 3 + 0.15 * puttyKg + 5 * s25 + ds.labor.end_bead_m;
                    const sellLm = ov.end_bead_sell > 0 ? ov.end_bead_sell : this.roundUp(costLm * marginMult, ds.config.round_to);
                    return { costLm, sellLm };
                }
                return { costLm: 0, sellLm: 0, costFlat: 0, sellFlat: 0 };
            },

            // Calculate Ceiling Package (Flat m2 & Linear Cove m.ط)
            // - Color (White/Green/Red) updates BOTH Flat AND Cove!
            // - Shadow Gap (Normal/LED) updates BOTH Flat (like wall angle perimeter) AND Cove!
            // - Corner Bead & End Bead update Cove (and are pre-activated on Premium & Pro)!
            calcPackage(ds, pkgId, color = 'white', addons = {}) {
                const pkg = PACKAGES_DEF.find(p => p.id === pkgId);
                const boardId = pkg.boardIds[color] || pkg.boardIds.white;
                const boardP = this.priceOf(ds, boardId);
                const angleP = this.priceOf(ds, pkg.angleId);
                const omegaP = this.priceOf(ds, pkg.omegaId);
                const cP = this.priceOf(ds, pkg.cId);
                if (boardP <= 0 || angleP <= 0 || omegaP <= 0 || cP <= 0) {
                    return { missing: true, flatPrice: 0, covePrice: 0 };
                }

                const useTish = pkg.includes_tish || !!addons.tish;

                // 1) Base Flat Ceiling (m2)
                const flatBoards = (1/3.60) * 1.10 * boardP;
                const flatMetal = (1.10/3)*cP + ((1/0.60)*1.10/3)*omegaP + (1.0/3)*angleP;
                const flatSusp = this.suspensionFlatMat(ds, useTish);
                const flatFast = this.ceilingFastPuttyMat(ds, useTish);
                const baseFlatMat = flatBoards + flatMetal + flatSusp + flatFast;
                const baseFlatLabor = useTish ? ds.labor.ceiling_tish_m2 : ds.labor.ceiling_genish_m2;
                let flatCost = baseFlatMat + baseFlatLabor;

                // 2) Base Linear Cove (m.ط) — Uses exact color boardP!
                let baseCoveMat = (0.5175/3.60)*boardP + (2.16/3)*angleP + (1.10/3)*omegaP
                    + 1.05*(this.priceOf(ds,46)/30) + 0.25*(this.priceOf(ds,49)/12.5)
                    + 12*(this.priceOf(ds,57)/1000) + 8*(this.priceOf(ds,67)/1000);
                let baseCoveLabor = ds.labor.ceiling_linear_m;

                if (!pkg.includes_tish && addons.tish) {
                    baseCoveMat += this.tishLinearMatDelta(ds);
                    baseCoveLabor += Math.max(0, ds.labor.ceiling_tish_m2 - ds.labor.ceiling_genish_m2);
                }
                let coveCost = baseCoveMat + baseCoveLabor;

                const marginMult = 1 + (ds.config.ceiling_margin_pct / 100);
                let flatSell = this.roundUp(flatCost * marginMult, ds.config.round_to);
                let coveSell = this.roundUp(coveCost * marginMult, ds.config.round_to);

                // 3) Shadow Gap applies to BOTH Flat (perimeter ratio like wall angle) AND Cove (linear)
                if (addons.shadow) {
                    const sh = this.addonUnit(ds, 'shadow');
                    flatCost += sh.costFlat;
                    flatSell += sh.sellFlat;
                    coveCost += sh.costLm;
                    coveSell += sh.sellLm;
                }
                if (addons.shadowLed) {
                    const shl = this.addonUnit(ds, 'shadowLed');
                    flatCost += shl.costFlat;
                    flatSell += shl.sellFlat;
                    coveCost += shl.costLm;
                    coveSell += shl.sellLm;
                }

                // 4) Corner Bead & End Bead apply to Linear (Cove)
                if (addons.corner) {
                    const cb = this.addonUnit(ds, 'corner');
                    coveCost += cb.costLm;
                    coveSell += cb.sellLm;
                }
                if (addons.endBead) {
                    const eb = this.addonUnit(ds, 'endBead');
                    coveCost += eb.costLm;
                    coveSell += eb.sellLm;
                }

                return {
                    missing: false,
                    flatMat: baseFlatMat, flatLabor: baseFlatLabor, flatCost, flatPrice: flatSell,
                    flatProfit: flatSell - flatCost, flatMarginPct: ((flatSell - flatCost) / flatSell) * 100,
                    coveMat: baseCoveMat, coveLabor: baseCoveLabor, coveCost, covePrice: coveSell,
                    coveProfit: coveSell - coveCost, coveMarginPct: ((coveSell - coveCost) / coveSell) * 100

            // Calculate Gypsum Walls (5 / 7 / 10 cm)
            calcWall(ds, { system, width, steel, brand, color, rockwool }) {
                const profileMap = {
                    '5_c35': [37, 39], '5_c40': [36, 38], '5_gm50': [98, 100], '5_gm60': [99, 101],
                    '7_c35': [41, 43], '7_c40': [40, 42], '7_gm50': [102, 104], '7_gm60': [103, 105],
                    '10_c40': [44, 45], '10_gm50': [106, 108], '10_gm60': [107, 109]
                };
                const boardMap = {
                    knauf: { white: 1, green: 2, red: 3 },
                    gboard: { white: 5, green: 6, red: 7 },
                    osman: { white: 11, green: 12, red: 13 }
                };
                const pair = profileMap[`${width}_${steel}`];
                if (!pair) return { unavailable: true };
                const studP = this.priceOf(ds, pair[0]), trackP = this.priceOf(ds, pair[1]), boardP = this.priceOf(ds, boardMap[brand][color]);
                if (!studP || !trackP || !boardP) return { missing: true };

                const metalCost = (2.20/3)*studP + (0.75/3)*trackP;
                const board1Face = (1/3.60)*1.10*boardP;
                const s25 = this.priceOf(ds,57)/1000, s35 = this.priceOf(ds,58)/1000, tek = this.priceOf(ds,67)/1000, fischer = this.priceOf(ds,73)/100, puttyKg = this.priceOf(ds,49)/12.5, fiberM = this.priceOf(ds,48)/90;
                let boardsCost = 0, fastCost = 0, labor = 0;
                if (system === 'cladding') { boardsCost = board1Face; fastCost = 17*s25 + 6*tek + 2*fischer + 0.40*puttyKg + 1.60*fiberM; labor = ds.labor.wall_cladding_m2; }
                else if (system === 'w111') { boardsCost = board1Face*2; fastCost = 32*s25 + 6*tek + 2*fischer + 0.75*puttyKg + 3.20*fiberM; labor = ds.labor.wall_w111_m2; }
                else { boardsCost = board1Face*4; fastCost = 15*s25 + 32*s35 + 6*tek + 2*fischer + 0.95*puttyKg + 3.20*fiberM; labor = ds.labor.wall_w112_m2; }

                let rockwoolMissing = false, rockwoolCost = 0;
                if (rockwool) {
                    const rwP = this.priceOf(ds, 135);
                    if (rwP <= 0) rockwoolMissing = true;
                    else rockwoolCost = rwP * 1.05 + ds.labor.rockwool_m2;
                }
                const totalCost = metalCost + boardsCost + fastCost + labor + rockwoolCost;
                const sell = this.roundUp(totalCost * (1 + ds.config.systems_margin_pct/100), ds.config.round_to);
                return { missing: rockwoolMissing, totalCost, sellPrice: sell, profit: sell - totalCost };
            },

            // Calculate Cement Board (Now supports 5 / 7 / 10 cm Wall Profiles + Steel 0.50/0.60 + Acoustic Rockwool!)
            calcCement(ds, { type, width = '7', steel = 'gm60', boardId, rockwool = false }) {
                const boardP = this.priceOf(ds, boardId);
                if (boardP <= 0) return { missing: true };
                const board1Face = (1/2.88)*1.10*boardP; // 2.88m2 mandatory board area!
                const drillScrew = this.priceOf(ds,65)/500, tek = this.priceOf(ds,67)/1000, fischer = this.priceOf(ds,73)/100, cemPuttyKg = this.priceOf(ds,54)/20, fiberM = this.priceOf(ds,48)/90;

                const profileMap = {
                    '5_gm50': [98, 100], '5_gm60': [99, 101],
                    '7_gm50': [102, 104], '7_gm60': [103, 105],
                    '10_gm50': [106, 108], '10_gm60': [107, 109]
                };

                let mat = 0;
                if (type === 'ceiling') {
                    const metal = 1.2222*this.priceOf(ds,96) + 0.4889*this.priceOf(ds,95) + 0.3333*this.priceOf(ds,97);
                    const susp = 0.4163*this.priceOf(ds,71) + 1.85*(this.priceOf(ds,68)/100 + this.priceOf(ds,75) + this.priceOf(ds,76) + 2*(this.priceOf(ds,74)/380));
                    mat = board1Face + metal + susp + 26*drillScrew + 12*tek + 2.5*fischer + 0.75*cemPuttyKg + 1.90*fiberM;
                } else {
                    const pair = profileMap[`${width}_${steel}`] || [103, 105];
                    const studP = this.priceOf(ds, pair[0]), trackP = this.priceOf(ds, pair[1]);
                    const metal = 1.0267 * studP + 0.25 * trackP; // @40cm spacing for heavy cement board
                    if (type === 'wall1') {
                        mat = board1Face + metal + 20*drillScrew + 8*tek + 2*fischer + 0.70*cemPuttyKg + 1.80*fiberM;
                    } else {
                        mat = board1Face*2 + metal + 40*drillScrew + 8*tek + 2*fischer + 1.40*cemPuttyKg + 3.60*fiberM;
                    }
                }

                let rockwoolMissing = false, rockwoolCost = 0;
                if (rockwool) {
                    const rwP = this.priceOf(ds, 135);
                    if (rwP <= 0) rockwoolMissing = true;
                    else rockwoolCost = rwP * 1.05 + ds.labor.rockwool_m2;
                }

                const labor = ds.labor.cement_board_m2 * (type === 'wall2' ? 1.3 : 1);
                const totalCost = mat + labor + rockwoolCost;
                const sell = this.roundUp(totalCost*(1 + ds.config.systems_margin_pct/100), ds.config.round_to);
                return { missing: rockwoolMissing, totalCost, sellPrice: sell, profit: sell - totalCost };
            },

            calcTile60(ds, { tileId, systemType }) {
                const tileP = this.priceOf(ds, tileId);

                    const mt = this.priceOf(ds,131), ct12 = this.priceOf(ds,132), ct06 = this.priceOf(ds,133), wa = this.priceOf(ds,134);
                    if (bundleP > 0) gridMat = bundleP;

                    else return { missing: true };
                    labor = ds.labor.tiles_layin_m2;
                }
                const totalCost = tileMat + gridMat + labor;
                const sell = this.roundUp(totalCost*(1 + ds.config.systems_margin_pct/100), ds.config.round_to);
                return { missing: false, totalCost, sellPrice: sell, profit: sell - totalCost };
            }

                                        <p class="text-[11px] text-gray-300">مسطح: ${totals.totalArea.toFixed(2)} م² | طولي: ${totals.totalLinear.toFixed(2)} م.ط${totals.shadowM>0?` | شادو جاب: ${totals.shadowM.toFixed(1)} م.ط (${totals.shadowRods} عود 3م)`:''}</p>

                                    <div class="bg-white/10 p-3 rounded-xl"><div class="text-2xl font-black text-gold">${totals.omegas}</div><div class="text-[11px]">أوميجا/قائم 3م</div></div>
                                    <div class="bg-white/10 p-3 rounded-xl"><div class="text-2xl font-black text-gold">${totals.cChannels}</div><div class="text-[11px]">رئيسي سي C38</div></div>

            },

            _stepperHtml(label, field, val, step, isAdminMode) {
                return `<div><label class="block text-xs font-bold text-gray-600 mb-1">${label}</label><div class="flex items-center border-2 border-gray-200 rounded-xl overflow-hidden"><button onclick="app.stepRoomField('${field}', -${step}, ${isAdminMode})" class="px-3 py-2 bg-gray-100 font-black text-primary">−</button><input type="number" value="${val}" onchange="app.updateRoomField('${field}', Number(this.value), ${isAdminMode})" class="w-full text-center font-extrabold text-sm py-2 outline-none"><button onclick="app.stepRoomField('${field}', ${step}, ${isAdminMode})" class="px-3 py-2 bg-gray-100 font-black text-primary">+</button></div></div>`;
            },

            _refreshWorker(isAdminMode) {
                if (isAdminMode) this.adminNavigate('worker_quotes');
                else this.renderWorker(document.getElementById('main-content'), false);
            },
            addWorkerRoom(isAdminMode) {
                const nextId = Math.max(0, ...this.workerRooms.map(r => r.id)) + 1;
                this.workerRooms.push({ id: nextId, name: `مكان ${nextId}`, type: 'ceiling', L: 300, W: 300, drop: 20, waste: 10, spacing: 60, layers: 1, susp: 'gansh', shadow: 'none', rotated: false });
                this.activeRoomId = nextId; this._refreshWorker(isAdminMode);
            },
            deleteWorkerRoom(id, isAdminMode) {
                if (this.workerRooms.length <= 1) return;
                this.workerRooms = this.workerRooms.filter(r => r.id !== id);
                this.activeRoomId = this.workerRooms[0].id; this._refreshWorker(isAdminMode);
            },
            resetWorkerRooms(isAdminMode) {
                this.workerRooms = JSON.parse(JSON.stringify(DEFAULT_WORKER_ROOMS));
                this.activeRoomId = 1;
                this.toast('تم إعادة ضبط الغرف في حاسبة الصنايعي فقط');
                this._refreshWorker(isAdminMode);
            },
            updateRoomField(field, value, isAdminMode) {
                const r = this.workerRooms.find(x => x.id === this.activeRoomId); if (!r) return;
                r[field] = value; this._refreshWorker(isAdminMode);
            },
            stepRoomField(field, delta, isAdminMode) {
                const r = this.workerRooms.find(x => x.id === this.activeRoomId); if (!r) return;
                r[field] = Math.max(field==='waste'?0:10, (Number(r[field])||0)+delta); this._refreshWorker(isAdminMode);
            },

            computeWorkerTotals() {
                let totalArea=0, totalLinear=0, boards=0, angles=0, omegas=0, cChannels=0, screws25=0, screws35=0, tek=0, fischer=0, puttyKg=0, tapeM=0, gansh=0, tishPts=0, tishLenM=0, shadowM=0, shadowRods=0;
                this.workerRooms.forEach(r => {
                    const wf = 1 + (r.waste||10)/100, Lm = r.L/100, Wm = r.W/100;
                    if (r.type === 'ceiling') {
                        const area = Lm*Wm, perim = 2*(Lm+Wm); totalArea += area;
                        boards += (area/3.60)*wf*r.layers; angles += (perim*wf)/3.0;
                        if (r.shadow && r.shadow !== 'none') { shadowM += perim; shadowRods += (perim * 1.08) / 3.0; }
                        const mainSpan = r.rotated ? Lm : Wm, crossSpan = r.rotated ? Wm : Lm;
                        cChannels += (Math.max(1, Math.floor(crossSpan/1.0))*mainSpan*wf)/3.0;
                        omegas += (Math.max(1, Math.ceil(mainSpan/(r.spacing/100))-1)*crossSpan*wf)/3.0;
                        const pts = Math.ceil(area*1.20);
                        if (r.susp==='tish') { tishPts += pts; tishLenM += pts*((r.drop/100)+0.05); fischer += Math.ceil(perim*2.5); }
                        else { gansh += pts; fischer += Math.ceil(perim*2.5 + pts); }
                        if (r.layers===1) screws25 += Math.ceil(area*(r.spacing===40?26:20)); else { screws25 += Math.ceil(area*10); screws35 += Math.ceil(area*20); }
                        tek += Math.ceil(area*8); puttyKg += area*0.40; tapeM += area*1.60;
                    } else if (r.type === 'cove') {
                        totalLinear += Lm; boards += (0.45*Lm*(wf+0.05))/3.60; angles += (2*Lm*wf)/3.0; omegas += (Lm*wf)/3.0;
                        if (r.shadow && r.shadow !== 'none') { shadowM += Lm; shadowRods += (Lm * 1.08) / 3.0; }
                        screws25 += Math.ceil(Lm*12); tek += Math.ceil(Lm*8); puttyKg += Lm*0.25; tapeM += Lm*1.05;
                    } else {
                        const area = Lm*Wm, faces = r.type==='w111'?2:1; totalArea += area;
                        boards += (area*faces*r.layers*wf)/3.60; angles += (2*Lm*wf)/3.0; omegas += ((Math.ceil(Lm/(r.spacing/100))+1)*Wm*wf)/3.0;
                        screws25 += Math.ceil(area*faces*16); tek += Math.ceil(area*6); fischer += Math.ceil(Lm*4); puttyKg += area*0.6; tapeM += area*2.4;
                    }
                });
                return { totalArea, totalLinear, boards: Math.ceil(boards), angles: Math.ceil(angles), omegas: Math.ceil(omegas), cChannels: Math.ceil(cChannels), screws25, screws35, tek, fischer, puttyKg, tapeM, gansh, tishPts, tishRods: Math.ceil(tishLenM/2.0), shadowM, shadowRods: Math.ceil(shadowRods) };
            },

            drawWorkerCanvas(r) {
                const canvas = document.getElementById('room-canvas'); if (!canvas) return;
                const ctx = canvas.getContext('2d'), cw = canvas.width, ch = canvas.height;
                ctx.clearRect(0, 0, cw, ch);
                const pad = 40, scale = Math.min((cw-pad*2)/Math.max(1,r.L), (ch-pad*2)/Math.max(1,r.type==='cove'?60:r.W));
                const rw = r.L*scale, rh = (r.type==='cove'?60:r.W)*scale, x0 = (cw-rw)/2, y0 = (ch-rh)/2;
                ctx.fillStyle = '#ECFDF5'; ctx.fillRect(x0, y0, rw, rh);
                if (r.type === 'ceiling') {
                    ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 1.5; ctx.setLineDash([5,4]);
                    const cCnt = r.rotated ? Math.floor(r.L/100) : Math.floor(r.W/100);
                    for (let i=1; i<=cCnt; i++) { ctx.beginPath(); if(!r.rotated){const y=y0+i*100*scale; ctx.moveTo(x0,y); ctx.lineTo(x0+rw,y);} else {const x=x0+i*100*scale; ctx.moveTo(x,y0); ctx.lineTo(x,y0+rh);} ctx.stroke(); }
                    ctx.setLineDash([]);
                    ctx.strokeStyle = '#E2B41A'; ctx.lineWidth = 2;
                    const oCnt = r.rotated ? Math.floor(r.W/r.spacing) : Math.floor(r.L/r.spacing);
                    for (let i=1; i<=oCnt; i++) { ctx.beginPath(); if(!r.rotated){const x=x0+i*r.spacing*scale; ctx.moveTo(x,y0); ctx.lineTo(x,y0+rh);} else {const y=y0+i*r.spacing*scale; ctx.moveTo(x0,y); ctx.lineTo(x0+rw,y);} ctx.stroke(); }
                    ctx.fillStyle = '#EF4444';
                    for (let lx=100; lx<r.L; lx+=100) for (let ly=100; ly<r.W; ly+=100) { ctx.beginPath(); ctx.arc(x0+lx*scale, y0+ly*scale, 3, 0, Math.PI*2); ctx.fill(); }
                } else if (r.type !== 'cove') {
                    ctx.strokeStyle = '#E2B41A'; ctx.lineWidth = 2;
                    for (let lx=r.spacing; lx<r.L; lx+=r.spacing) { ctx.beginPath(); ctx.moveTo(x0+lx*scale, y0); ctx.lineTo(x0+lx*scale, y0+rh); ctx.stroke(); }
                }
                ctx.strokeStyle = (r.shadow && r.shadow !== 'none') ? '#D97706' : '#1E4D2B';
                ctx.lineWidth = (r.shadow && r.shadow !== 'none') ? 4.5 : 3.5;
                ctx.strokeRect(x0, y0, rw, rh);
                ctx.fillStyle = '#14351D'; ctx.font = 'bold 13px Cairo'; ctx.textAlign = 'center';
                ctx.fillText(`الطول: ${(r.L/100).toFixed(2)} م`, cw/2, y0-12);
                if (r.type !== 'cove') {
                    ctx.save(); ctx.translate(x0-15, ch/2); ctx.rotate(-Math.PI/2);
                    ctx.fillText(`${r.type==='ceiling'?'العرض':'الارتفاع'}: ${(r.W/100).toFixed(2)} م`, 0, 0);
                    ctx.restore();
                }
            },

            _formatWorkerBOMText() {
                const t = this.computeWorkerTotals();
                const roomsStr = this.workerRooms.map((r,i)=>`${i+1}. ${r.name}: ${(r.L/100).toFixed(2)}م${r.type!=='cove'?' × '+(r.W/100).toFixed(2)+'م':''}${r.shadow!=='none'?' + شادو جاب':''}`).join('\n');
                return `كشف خامات داركم (كميات فقط):\n${roomsStr}\n-----------------\n• ألواح جبس 3م: ${t.boards} لوح\n• زاوية/تراك 3م: ${t.angles} عود\n• أوميجا/قوائم 3م: ${t.omegas} عود\n• سي C38: ${t.cChannels} عود${t.shadowRods?`\n• شادو جاب 3م: ${t.shadowRods} عود (${t.shadowM.toFixed(1)} م.ط)`:''}\n• مسمار 25: ${t.screws25} | 35: ${t.screws35} | تك: ${t.tek}\n• معجون: ${t.puttyKg.toFixed(1)} كجم | فايبر: ${Math.ceil(t.tapeM)} م.ط`;
            },
            copyWorkerBOM() { navigator.clipboard.writeText(this._formatWorkerBOMText()).then(() => this.toast('تم نسخ كشف الخامات')); },
            sendWorkerBOMWhatsApp() { window.open(`https://wa.me/201025013991?text=${encodeURIComponent(this._formatWorkerBOMText())}`, '_blank'); },

            importRoomsToQuote() {

                const rBase = Engine.calcPackage(ds, q.pkgId, q.color, baseAddons);
                const colorLbl = { white:'أبيض', green:'أخضر', red:'أحمر' }[q.color];

                this.workerRooms.forEach(rm => {
                    const Lm = rm.L / 100, Wm = rm.W / 100;
                    if (rm.type === 'ceiling') {
                        const area = Number((Lm * Wm).toFixed(2));
                        const perim = Number((2 * (Lm + Wm)).toFixed(2));
                        q.items.push({ label: `${rm.name} — سقف فلات (${pkg.name} ${colorLbl})`, unit: 'م²', qty: area, unitCost: rBase.flatCost, unitSell: rBase.flatPrice });

                        } else if (rm.shadow === 'led') {

                    { id:118, name:'توب بورد 12مم' },

                    { id:25, name:'جبس كناوف 9مم', sys:'layin' },
                    { id:26, name:'جبس كناوف 12مم', sys:'layin' },
                    { id:21, name:'جبس جيبورد 9مم', sys:'layin' },

                        const cost = m.price + ds.labor.access_panel_pc;
                        const sell = Engine.roundUp(cost * marginSys, ds.config.round_to);
                        return { name: m.name, unit:'قطعة', cost, sell };

                    { name: 'شادو جاب عادي (م.ط)', unit:'م.ط', cost: Engine.addonUnit(ds,'shadow').costLm, sell: Engine.addonUnit(ds,'shadow').sellLm },

                                <option value="red" ${this.adminPkgColor==='red'?'selected':''}>🔴 أحمر</option>

                        </div>
                    </div>

                    <!-- All Systems Sub-Tabs inside Packages & Publish -->

                            ['ceilings', '🏠 الباقات الـ 5 (مسطح + طولي)'],
                            ['walls', '🧱 الحوائط والتجاليد (5/7/10 سم)'],
                            ['cement', '🛡️ السيمنت بورد (5/7/10 سم + سقف)'],
                            ['tiles', '⬜ بلاطات 60×60'],
                            ['extras', '🚪 أبواب الكشف والشادو والإكسسوارات']
                        ].map(([k, lbl]) => `
                            <button onclick="app.adminPkgSection='${k}'; app.adminNavigate('packages')" class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${sec===k?'bg-primary text-gold shadow':'bg-white border text-gray-600 hover:border-primary'}">${lbl}</button>
                        `).join('')}
                    </div>

                    ${bodyHtml}`;
            }
        };

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
